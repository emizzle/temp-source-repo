name: Generate API docs

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master

concurrency:
  # Prenvent concurrent release runs. This happens, eg, in a
  # double-dispatch (clicking "Run workflow" multiple times in a row) or if
  # multiple commits are pushed in quick succession to master (eg, a bugfix
  # right after a release commit).
  # All runs target the same shared GCP cluster/Terraform state, so serialize
  # them instead of racing for the state lock.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_env.outputs.version }}
    steps:
      - id: set_env
        run: |
          # version = "v0.4.3" or "master"
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

  # Generate API docs into "next" version of docs
  genapidocs:
    runs-on: ubuntu-latest
    needs: [setup]
    outputs:
      branch: ${{ steps.set_branch.outputs.branch }}
    env:
      REF: ${{ github.ref_name }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Create branch for docs update
        id: set_branch
        run: |
          BRANCH=$(printf '%s' "${REPO#*/}-${REF}" \
            | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9.-' '-') # lowercase and replace blacklisted chars
          BRANCH="${BRANCH#-}"; BRANCH="${BRANCH%.lock}" # remove '-' prefix and '.lock' suffix
          git check-ref-format --normalize "refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Generate APIs in docs repo 
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: logos-storage/logos-storage-docs
          event-type: update-docs
          client-payload: |-
            {
              "repo": "$GITHUB_REPOSITORY",
              "ref": "$REF",
              "branch", "${{ steps.set_branch.outputs.branch }}",
              "sources": "docs/sources.json"
            }
  # Release
  release:
    runs-on: ubuntu-latest
    needs: [setup, genapidocs]
    env: 
      VERSION: ${{ needs.setup.outputs.version }}
      BRANCH: ${{ needs.genapidocs.outputs.branch }}
    steps:
      - name: Generate APIs in docs repo 
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: logos-storage/logos-storage-docs
          event-type: version-docs
          client-payload: |-
            {
              "branch": "$BRANCH",
              "versions": [
                {
                  "targetInstanceId": "storage_node",
                  "version", "$VERSION",
                },
                {
                  "targetInstanceId": "storage_module",
                  "version", "$VERSION",
                }
              ]
            }
